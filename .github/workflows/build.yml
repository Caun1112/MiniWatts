name: Build

# Master/PR/manual runs validate; v* tags additionally publish releases.
# IPA compilation always happens here. No signing identity is needed.
on:
  push:
    tags: ["v*"]
    branches: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipa:
    name: Unsigned ipa
    runs-on: macos-latest
    permissions:
      # Only the release step at the bottom uses this, and only on a tag.
      contents: write

    steps:
      # Full history and tags: the build number is the commit count, and a shallow
      # clone would make every build number 1.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$newest"
          xcodebuild -version
          swift --version

      # MiniWatts uses `nonisolated` on type and extension declarations and
      # SWIFT_DEFAULT_ACTOR_ISOLATION, so an older toolchain fails deep in the
      # compile with errors that do not name the real cause. Say it up front.
      - name: Check toolchain
        run: |
          required=6.2
          found=$(swift -version 2>&1 | sed -n 's/.*Swift version \([0-9][0-9.]*\).*/\1/p' | head -1)
          echo "Swift $found (need $required or newer)"
          if [ "$(printf '%s\n%s\n' "$required" "$found" | sort -V | head -1)" != "$required" ]; then
            echo "::error::Swift $found is too old. This project needs Swift $required or newer; pin a runner image that ships it."
            exit 1
          fi

      # Xcode 27 beta writes `objectVersion = 110` on save, and no released Xcode —
      # so no runner — can open that. The failure from xcodebuild is "a future Xcode
      # project file format", which does not say what to do about it. Say it here.
      - name: Check project format
        run: |
          max=77
          found=$(sed -n 's/^[[:space:]]*objectVersion = \([0-9]*\);/\1/p' MiniWatts.xcodeproj/project.pbxproj)
          echo "project objectVersion $found (max readable by a released Xcode: $max)"
          if [ "$found" -gt "$max" ]; then
            echo "::error::project.pbxproj is at objectVersion $found, which only an Xcode beta can read. Xcode re-upgraded the project format on save. In Xcode: select the project, File inspector, Project Format -> Xcode 16.0-compatible; or set objectVersion back to $max by hand. Nothing in this project needs a format newer than $max."
            exit 1
          fi

      # On a tag, the tag is the version: build-ipa.sh hands MARKETING_VERSION to
      # xcodebuild, so the project file never has to be edited to cut a release. Taken
      # from the triggering tag explicitly rather than left to the script's own git
      # lookup, which cannot tell which of two tags on one commit this run is for.
      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "MARKETING_VERSION=${version%%-*}" >> "$GITHUB_ENV"

      - name: Validate charge integration
        run: |
          python3 scripts/test-charge-integration.py
          clang -fobjc-arc -framework Foundation scripts/test-charge-validation.m -o /tmp/charge-validation
          /tmp/charge-validation
          node scripts/test-charge-preferences.js
          python3 scripts/test-charge-launcher.py
          python3 scripts/test-charge-startup.py
          python3 scripts/test-charge-installers.py

      - name: Build unsigned ipa
        run: ./scripts/build-ipa.sh

      # Nothing about the machine that produced the build may reach the artifact.
      - name: Verify the ipa carries no identifying data
        run: |
          ./scripts/verify-clean.sh build/export/MiniWatts-unsigned.ipa
          python3 scripts/verify-charge-ipa.py build/export/MiniWatts-unsigned.ipa

      # The version reaches the bundle only as a build-setting override. If that ever
      # stops working, a release named v1.2.0 would quietly ship a binary saying 1.0.
      - name: Check the ipa reports the tag's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          work=$(mktemp -d)
          unzip -q build/export/MiniWatts-unsigned.ipa -d "$work"
          plist="$(ls -d "$work"/Payload/*.app)/Info.plist"
          built=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
          number=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")
          echo "tag $GITHUB_REF_NAME -> ipa $built ($number)"
          if [ "$built" != "$MARKETING_VERSION" ]; then
            echo "::error::The ipa reports version $built but the tag is $GITHUB_REF_NAME: MARKETING_VERSION did not reach the bundle."
            exit 1
          fi

      - name: Package TrollStore IPA and rootless DEB
        run: |
          command -v dpkg-deb >/dev/null || brew install dpkg
          ./scripts/package-installers.sh
          dpkg-deb --info build/export/MiniWatts-rootless.deb

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: MiniWatts-unsigned-ipa
          path: |
            build/export/MiniWatts-unsigned.ipa
            build/export/MiniWatts-TrollStore.ipa
            build/export/MiniWatts-rootless.deb
            scripts/ChargeControl.entitlements
          if-no-files-found: error

      # Kept separately: the ipa is stripped, so a crash report needs this to
      # symbolicate. It is not attached to releases — it is a build-time asset.
      - name: Upload dSYM
        uses: actions/upload-artifact@v4
        with:
          name: MiniWatts-dSYM
          path: build/DerivedData/Build/Products/Release-iphoneos/*.dSYM
          if-no-files-found: warn

      # The AltStore / SideStore source, published next to the ipa. Its address never
      # changes — releases/latest/download/apps.json follows the newest release that is
      # not a pre-release, so a beta tag never reaches people who added the source, and
      # nothing is committed back to the repository. The script reads version, build,
      # size and permissions from the ipa itself: AltStore refuses an app whose ipa
      # disagrees with its source on any of them.
      - name: Write the app source
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/make-source.py build/export/MiniWatts-unsigned.ipa "$GITHUB_REF_NAME" > build/export/apps.json

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/export/MiniWatts-unsigned.ipa
            build/export/MiniWatts-TrollStore.ipa
            build/export/MiniWatts-rootless.deb
            build/export/apps.json
            scripts/ChargeControl.entitlements
          fail_on_unmatched_files: true
          generate_release_notes: true
          # A tag with a hyphen in it — v1.1.0-beta1 — publishes as a pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Pre-pended to the generated notes. One line, pointing at the README
          # rather than repeating it: a release body is frozen at publish time, so
          # anything copied in here goes stale the moment the README changes, on
          # every release already published.
          body: |
            TrollStore / TrollStore Lite users: choose MiniWatts-TrollStore.ipa (ad-hoc entitlements, no developer certificate). Sileo rootless users: choose MiniWatts-rootless.deb. MiniWatts-unsigned.ipa has no embedded entitlements and requires your own signing pipeline. See docs/installers.md.
            ${{ github.server_url }}/${{ github.repository }}#install
